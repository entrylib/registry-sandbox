name: check

# The registry's checks on every pull request (portal check, design §6): a publication adds exactly one new version
# and changes nothing else; a maintenance pull request changes only the repository's own files. Published versions
# are never modified. The portal merges a publication only when this check passes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Not pinned: each run checks with the current portal and the newest claimset, so this file never needs to change
  # when either does. Each version's validation.json records the validator that checked it.
  PORTAL: git+https://github.com/entrylib/portal

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "portal @ $PORTAL"
      - run: git fetch -q origin main
      - run: portal check --registry . --base origin/main
